name = "retaino-api"
main = "src/server.ts"
compatibility_date = "2026-05-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[[r2_buckets]]
binding = "CONTACT_IMPORTS_BUCKET"
bucket_name = "retaino-contact-imports"

[[ratelimits]]
name = "TRACKING_REDIRECT_RATE_LIMITER"
namespace_id = "2026052001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "TRACKING_REDIRECT_ROUTE_RATE_LIMITER"
namespace_id = "2026052002"

  [ratelimits.simple]
  limit = 1500
  period = 60

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "0bb96ea0a69d413aafc37de40e99ba76"

[[routes]]
pattern = "api.retaino.io"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 1
