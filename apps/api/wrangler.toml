name = "retaino-api"
main = "src/server.ts"
compatibility_date = "2026-05-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true
upload_source_maps = true

[vars]
APP_ALLOWED_ORIGINS = "https://retaino.io,https://www.retaino.io"
INNGEST_SERVE_ORIGIN = "https://api.retaino.io"
INNGEST_SERVE_PATH = "/v1/inngest"
SENTRY_DSN = "https://326611dc15d28f11f318942fbd677547@o4508629590081536.ingest.de.sentry.io/4511457965047888"
SENTRY_ENVIRONMENT = "production"
SMS_SENDING_MODE = "live"
STRIPE_CANCEL_URL = "https://retaino.io/app/settings/billing"
STRIPE_CHECKOUT_DISPLAY_NAME = "Retaino"
STRIPE_PRICE_CREDITS_500_ID = "price_1TXMZmLgaF62MYS8CYwV918e"
STRIPE_PRICE_CREDITS_1500_ID = "price_1TXMaELgaF62MYS8SN0eYaOy"
STRIPE_PRICE_CREDITS_5000_ID = "price_1TXMaYLgaF62MYS8IKeTD9Gc"
STRIPE_PRICE_GROWTH_ID = "price_1TXMWgLgaF62MYS8lDfFFcxb"
STRIPE_PRICE_SCALE_ID = "price_1TXMXXLgaF62MYS8Hcp5DVyG"
STRIPE_PRICE_STARTER_ID = "price_1TXMW3LgaF62MYS8BaRz4EBE"
STRIPE_RETURN_URL = "https://retaino.io/app/settings/billing"
STRIPE_SUCCESS_URL = "https://retaino.io/app/settings/billing/success"
TRACKING_BASE_URL = "https://go.retaino.io"
TWILIO_INBOUND_CALLBACK_BASE_URL = "https://api.retaino.io"
TWILIO_STATUS_CALLBACK_BASE_URL = "https://api.retaino.io"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[r2_buckets]]
binding = "CONTACT_IMPORTS_BUCKET"
bucket_name = "retaino-contact-imports"

[[ratelimits]]
name = "TRACKING_REDIRECT_RATE_LIMITER"
namespace_id = "2026052001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "TRACKING_REDIRECT_ROUTE_RATE_LIMITER"
namespace_id = "2026052002"

  [ratelimits.simple]
  limit = 1500
  period = 60

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "0bb96ea0a69d413aafc37de40e99ba76"

[[routes]]
pattern = "api.retaino.io"
custom_domain = true

[[routes]]
pattern = "go.retaino.io"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 1
